name: Tag version changes

on:
    push:

permissions:
    contents: write
    id-token: write

jobs:
    tag-version:
        if: github.ref_type == 'branch'
        runs-on: ubuntu-latest
        steps:
            # Checkout the repository to access its contents
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # Install Node.js and set up the environment
            - uses: actions/setup-node@v7
              with:
                  node-version: "24.x"
                  registry-url: "https://registry.npmjs.org"
            
            # Compare project versions in package.json "version" field
            - name: Compare project versions
              id: version
              env:
                BEFORE_SHA: ${{ github.event.before }}
                CURRENT_SHA: ${{ github.sha }}
              run: |
                node - <<'EOF'
                const fs = require('fs');
                const { execSync } = require('child_process');
                const before = process.env.BEFORE_SHA;
                const current = process.env.CURRENT_SHA;
                const readVersion = (sha) => {
                  try {
                    return JSON.parse(execSync(`git show ${sha}:package.json`, { stdio: ['ignore', 'pipe', 'ignore'] }).toString()).version;
                  } catch {
                    return undefined;
                  }
                };
                const changed = readVersion(before) !== readVersion(current);
                fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\n`);
                EOF
            - name: Output version change result
              if: steps.version.outputs.changed == 'true'
              run: echo "Version has changed."
            - name: Output version change result
              if: steps.version.outputs.changed != 'true'
              run: echo "Version has not changed." && exit 0

            # Create release tag if the version has changed
            - name: Create release tag
              id: tag
              if: steps.version.outputs.changed == 'true'
              run: |
                git config --global user.name "github-actions[bot]"
                git config --global user.email "github-actions[bot]@users.noreply.github.com"
                VERSION=$(node -p "require('./package.json').version")
                git tag "v$VERSION"
                git push origin "v$VERSION"
                echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            # Install dependencies and publish the package
            - run: npm i
              if: steps.version.outputs.changed == 'true'
            - run: npm ci
              if: steps.version.outputs.changed == 'true'
            # - run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
            #   env:
            #     NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
            #   if: steps.version.outputs.changed == 'true'
            - run: npm publish --access public
              if: steps.version.outputs.changed == 'true'
              env:
                NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Create GitHub release if the version has changed
            - name: Create GitHub release
              if: steps.version.outputs.changed == 'true'
              uses: actions/create-release@v1
              with:
                tag_name: v${{ steps.tag.outputs.version }}
                release_name: v${{ steps.tag.outputs.version }}
                draft: false
                prerelease: false
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   


