name: Tag version changes

on:
    push:

permissions:
    contents: write
    id-token: write

jobs:
    tag-version:
        if: github.ref_type == 'branch'
        runs-on: ubuntu-latest
        steps:
            # Checkout the repository to access its contents
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # Install Node.js and set up the environment
            - uses: actions/setup-node@v7
              with:
                  node-version: "20.x"
                  registry-url: "https://registry.npmjs.org"
            
            # Compare project versions
            - name: Compare project versions
              id: version
              env:
                BEFORE_SHA: ${{ github.event.before }}
                CURRENT_SHA: ${{ github.sha }}
              run: |
                node -e "
                  const fs = require('fs');
                  const before = process.env.BEFORE_SHA;
                  const current = process.env.CURRENT_SHA;
                  const beforeContent = fs.readFileSync(`.git/refs/heads/${before}`, 'utf-8').trim();
                  const currentContent = fs.readFileSync(`.git/refs/heads/${current}`, 'utf-8').trim();
                  const changed = beforeContent !== currentContent;
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\n`);
                "
            - name: Output version change result
              if: steps.version.outputs.changed == 'true'
              run: echo "Version has changed."
            - name: Output version change result
              if: steps.version.outputs.changed != 'true'
              run: echo "Version has not changed." && exit 0

            # Create release tag if the version has changed
            - name: Create release tag
              if: steps.version.outputs.changed == 'true'
              run: |
                git config --global user.name "github-actions[bot]"
                git config --global user.email "github-actions[bot]@users.noreply.github.com"
                VERSION=$(node -p "require('./package.json').version")
                git tag "v$VERSION"
                git push origin "v$VERSION"

            # Install dependencies and publish the package
            - run: npm ci
            - run: npm publish --provenance --access public
              env:
              NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            # Create GitHub release if the version has changed
            - name: Create GitHub release
              if: steps.version.outputs.changed == 'true'
              uses: actions/create-release@v1
              with:
                tag_name: "v$(node -p "require('./package.json').version")"
                release_name: "v$(node -p "require('./package.json').version")"
                draft: false
                prerelease: false
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   


